# Корень монорепо. Здесь НЕТ своего пакета и своего кода — файл нужен
# ровно для одного: объявить uv workspace.
#
# Зачем это понадобилось. У нас два питоновских проекта в одной папке:
#
#   backend/ — расчётное ядро, модели БД, сервисы, LLM
#   bot/     — Telegram-бот, который эти сервисы вызывает
#
# Без workspace они друг для друга не существуют: "import app.services"
# из bot/main.py упал бы с ModuleNotFoundError. Обойти это можно было бы
# дописыванием sys.path — приём, который работает при запуске "python
# main.py" из нужной папки и разваливается везде ещё: в pytest, в Docker,
# в подсказках редактора.
#
# Workspace решает это по-настоящему: uv ставит backend в общее окружение
# как обычный пакет (в editable-режиме — правка в backend/app сразу видна
# боту, без переустановки), и "import app" работает отовсюду.
#
# Практические следствия:
#
# * lock-файл на весь репозиторий один и лежит здесь. Это плюс: версия
#   pydantic у бота и у backend физически не может разъехаться;
# * команды запускаются из папки своего проекта, uv сам находит корень
#   workspace вверх по дереву;
# * "uv sync --all-packages" из корня ставит зависимости обоих проектов.

[tool.uv.workspace]
members = ["backend", "bot"]
