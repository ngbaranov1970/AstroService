[project]
name = "astro-backend"
version = "0.1.0"
description = "AstroService backend — FastAPI + расчётное ядро (натальная карта, Матрица Судьбы, восточный гороскоп)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Шаблонизатор: HTML лежит файлами с дырками ({{ chart.sun }}), Python
    # подставляет значения. Нужен веб-стенду и будущей странице оплаты.
    "jinja2>=3.1",
    # Разбор данных HTML-формы. FastAPI сам по себе понимает только JSON,
    # а браузер шлёт форму как multipart/form-data; без этого пакета любой
    # обработчик с Form(...) роняет приложение ещё на старте.
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "pyswisseph>=2.10",
    "kerykeion>=4.9",
    "cnlunar>=0.1.2",
    "timezonefinder>=6.5",
    # Рисование картинки к посту в ленту (app/services/card.py).
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "astro_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
